[package]
name = "list-10k"
description = "egui-reactor example: list-10k"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "list_10k"
path = "src/lib.rs"

[[bin]]
name = "list-10k"
path = "src/main.rs"

[[bin]]
name = "list-10k-plain"
path = "src/plain_main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-reactor.workspace = true
egui-reactor-app.workspace = true
egui-reactor-elements.workspace = true
example-meta.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[dev-dependencies]
egui_kittest.workspace = true
