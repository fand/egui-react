<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>egui-react: font</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="font" data-wasm-opt="z" />
    <!-- The `web` stack's font, served same-origin as `fonts/NotoSansJP-Regular.ttf`.
         Downloaded by the pre-build hook in Trunk.toml; see fonts/fetch-web-font.sh. -->
    <link data-trunk rel="copy-file" href="fonts/NotoSansJP-Regular.ttf" data-target-path="fonts" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101010;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="egui_react_canvas"></canvas>
  </body>
</html>
