[package]
name = "gallery"
description = "egui-reactor example gallery: every example, its code and a tag filter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "gallery"
path = "src/lib.rs"

[[bin]]
name = "gallery"
path = "src/main.rs"

# The documentation site's iframe: one example filling the canvas, picked by
# `location.hash`. A second bin rather than a crate of its own, so it reuses the
# gallery's example imports and `EXAMPLES` and adds no workspace member.
[[bin]]
name = "embed"
path = "src/embed.rs"

[features]
# Pixel snapshot tests: the egui-reactor and plain egui versions of an example
# rendered at the same size and compared with the same image. Needs a GPU (or a
# software Vulkan driver), so it is off by default.
snapshot = ["egui_kittest/snapshot", "egui_kittest/wgpu"]

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-reactor.workspace = true
egui-reactor-app.workspace = true
egui-reactor-elements.workspace = true
example-meta.workspace = true

board = { path = "../board" }
clock = { path = "../clock" }
counter = { path = "../counter" }
custom-hook = { path = "../custom-hook" }
escape-hatch = { path = "../escape-hatch" }
fetch = { path = "../fetch" }
font = { path = "../font" }
form = { path = "../form" }
layout = { path = "../layout" }
list-10k = { path = "../list-10k" }
patch = { path = "../patch" }
shader = { path = "../shader" }
notes = { path = "../notes" }
spreadsheet = { path = "../spreadsheet" }
styles = { path = "../styles" }
theme = { path = "../theme" }
todo = { path = "../todo" }

# `location.hash` is the deep link on the web; natively the first argument does
# the same job and needs nothing. `EventTarget` and `wasm-bindgen` are the
# embed's `hashchange` listener, which is how it hears about a new deep link.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["EventTarget", "Location", "Window"] }

[dev-dependencies]
egui_kittest.workspace = true
# `tests/thumbnails.rs` saves what the harness rendered; the version is the
# one egui_kittest already pulls in.
image = { version = "0.25", default-features = false, features = ["png"] }
# `tests/thumbnails.rs` builds the shader and patch pipelines on the harness's
# own render state, the way `Options::setup` does on eframe's.
egui-wgpu.workspace = true
