[package]
name = "gallery"
description = "react-egui example gallery: every example, its code and a tag filter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "gallery"
path = "src/lib.rs"

[[bin]]
name = "gallery"
path = "src/main.rs"

[features]
# Pixel snapshot tests: the react-egui and plain egui versions of an example
# rendered at the same size and compared with the same image. Needs a GPU (or a
# software Vulkan driver), so it is off by default.
snapshot = ["egui_kittest/snapshot", "egui_kittest/wgpu"]

[dependencies]
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
react-egui.workspace = true
react-egui-app.workspace = true
react-egui-elements.workspace = true
example-meta.workspace = true

board = { path = "../board" }
clock = { path = "../clock" }
counter = { path = "../counter" }
custom-hook = { path = "../custom-hook" }
escape-hatch = { path = "../escape-hatch" }
fetch = { path = "../fetch" }
form = { path = "../form" }
layout = { path = "../layout" }
list-10k = { path = "../list-10k" }
patch = { path = "../patch" }
shader = { path = "../shader" }
showcase = { path = "../showcase" }
theme = { path = "../theme" }
todo = { path = "../todo" }

# `location.hash` is the deep link on the web; natively the first argument does
# the same job and needs nothing.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Location", "Window"] }

[dev-dependencies]
egui_kittest.workspace = true
