[build]
target = "index.html"
dist = "dist"

# The `font` example's web font, served same-origin as
# `fonts/NotoSansJP-Regular.ttf` (the `copy-file` link in index.html). Not
# committed, so the same hook as examples/font/Trunk.toml downloads it first.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "sh \"${TRUNK_SOURCE_DIR:-.}/../font/fonts/fetch-web-font.sh\""]
