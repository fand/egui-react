<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>egui-reactor: example</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="embed" data-wasm-opt="z" />
    <!-- The font example's web font, at the same relative URL it fetches when it
         runs on its own. Downloaded by the pre-build hook in Trunk-embed.toml. -->
    <link data-trunk rel="copy-file" href="../font/fonts/NotoSansJP-Regular.otf" data-target-path="fonts" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101010;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="egui_reactor_canvas"></canvas>
  </body>
</html>
