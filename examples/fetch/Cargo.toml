[package]
name = "fetch"
description = "egui-react example: fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "fetch"
path = "src/lib.rs"

[[bin]]
name = "fetch"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-react.workspace = true
egui-react-app.workspace = true
egui-react-elements.workspace = true
example-meta.workspace = true

# `fetch_async` needs `native-async` on native (it pulls in `async-channel`);
# on wasm it is the browser's own fetch API and the feature would be dead weight.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ehttp = { workspace = true, features = ["native-async"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp.workspace = true
