[package]
name = "spreadsheet"
description = "egui-reactor example: a spreadsheet with formulas over 26 x 10,000 cells"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "spreadsheet"
path = "src/lib.rs"

[[bin]]
name = "spreadsheet"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
log.workspace = true
egui-reactor.workspace = true
egui-reactor-app.workspace = true
egui-reactor-elements.workspace = true
example-meta.workspace = true
serde.workspace = true
serde_json.workspace = true

# The undo history is `board`'s, unchanged, the same way `patch` borrows it:
# one hook, three examples. See docs/tasks/spreadsheet/plan.md section 5.
board = { path = "../board" }

[dev-dependencies]
egui_kittest.workspace = true
