[package]
name = "react-egui-app"
description = "Runner for react-egui apps: native and wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "react_egui_app"
path = "src/lib.rs"

[dependencies]
eframe = { workspace = true, features = ["persistence"] }
egui.workspace = true
log.workspace = true
react-egui.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
react-egui-elements.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
