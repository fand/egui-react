[package]
name = "react-egui-elements"
description = "Widgets, containers and flex/grid layout elements for react-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "react_egui_elements"
path = "src/lib.rs"

[features]
# Pixel snapshot tests. Needs a GPU (or a software Vulkan driver), so it is off
# by default and run as its own CI step.
snapshot = ["egui_kittest/snapshot", "egui_kittest/wgpu"]

[dependencies]
egui.workspace = true
react-egui.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
