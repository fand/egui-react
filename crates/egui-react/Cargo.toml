[package]
name = "egui-react"
description = "React-like views, components and hooks for egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "egui_react"
path = "src/lib.rs"

[dependencies]
egui.workspace = true
egui_taffy.workspace = true
elsa.workspace = true
log.workspace = true
egui-react-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
typed-builder.workspace = true

# The executor `use_future` / `spawn` run a future on: a thread with
# `pollster::block_on` on native, the browser's own loop on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
serde.workspace = true
trybuild.workspace = true
