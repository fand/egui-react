<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  /* An electron on each orbit. `offset-path` walks the same curve the orbit
     is drawn with, so the two cannot drift apart; the ball is drawn at the
     origin and put on the path by the offset. Declarative, because the file
     is loaded through an `img` and a script would not run there. */
  .electron {
    fill: #F74C00;
    offset-rotate: 0deg;
    animation: orbit 7s linear infinite;
  }
  .electron-a { offset-path: path("M600.168 797.201C884.687 797.201 1115.34 709.135 1115.34 600.501C1115.34 491.866 884.687 403.8 600.168 403.8C315.649 403.8 85 491.866 85 600.501C85 709.135 315.649 797.201 600.168 797.201Z"); }
  .electron-b { offset-path: path("M429.839 698.851C572.099 945.252 763.69 1100.97 857.771 1046.65C951.851 992.332 912.794 748.552 770.534 502.151C628.274 255.75 436.683 100.035 342.603 154.353C248.522 208.67 287.579 452.45 429.839 698.851Z"); animation-duration: 8.5s; }
  .electron-c { offset-path: path("M429.839 502.149C287.579 748.55 248.522 992.33 342.603 1046.65C436.683 1100.96 628.274 945.25 770.534 698.849C912.794 452.448 951.851 208.668 857.771 154.35C763.69 100.033 572.099 255.748 429.839 502.149Z"); animation-duration: 10s; animation-direction: reverse; }

  @keyframes orbit {
    to { offset-distance: 100%; }
  }

  /* Someone who asked for less motion gets the mark still, each ball parked
     on its own orbit. */
  @media (prefers-reduced-motion: reduce) {
    .electron { animation: none; offset-distance: 12%; }
  }
</style>
