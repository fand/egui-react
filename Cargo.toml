[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fand/react-egui"
rust-version = "1.95"

[workspace.dependencies]
react-egui = { path = "crates/react-egui", version = "0.1.0" }
react-egui-macros = { path = "crates/react-egui-macros", version = "0.1.0" }
react-egui-elements = { path = "crates/react-egui-elements", version = "0.1.0" }
react-egui-app = { path = "crates/react-egui-app", version = "0.1.0" }
example-meta = { path = "examples/meta", version = "0.1.0" }

egui = "0.36.1"
eframe = "0.36.1"
# `wgpu` and `snapshot` are intentionally left off: the tests run headless.
egui_kittest = { version = "0.36.1", default-features = false }
egui_taffy = "0.14.0"
# Only the gallery uses it, for `syntax_highlighting::code_view_ui`. No
# features: `syntect` would make the wasm much bigger and the built-in
# highlighter is enough.
egui_extras = { version = "0.36.1", default-features = false }
rstml = "0.13.0"
syn = { version = "3.0.5", features = ["full", "extra-traits", "visit", "visit-mut", "parsing", "printing", "proc-macro"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
typed-builder = "0.23.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = "0.3.83"
trybuild = "1.0.120"
ehttp = "0.7.1"
elsa = "1.11.2"
log = "0.4.34"
pollster = "1.0.1"
