[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fand/egui-react"
rust-version = "1.95"

[workspace.dependencies]
egui-react = { path = "crates/egui-react", version = "0.1.0" }
egui-react-macros = { path = "crates/egui-react-macros", version = "0.1.0" }
egui-react-elements = { path = "crates/egui-react-elements", version = "0.1.0" }
egui-react-app = { path = "crates/egui-react-app", version = "0.1.0" }
accesskit-web = { path = "crates/accesskit-web", version = "0.1.0" }
example-meta = { path = "examples/meta", version = "0.1.0" }

# `default-features = false` drops egui's one default feature,
# `default_fonts`: the four fonts epaint compiles in (Ubuntu-Light, Hack,
# NotoEmoji-Regular, emoji-icon-font, 1.4 MB together). Cargo unifies features
# over the whole graph, so one crate here asking for egui's defaults would put
# those bytes back for every app. `egui-react-app`'s own `default_fonts`
# feature turns them on again and is on by default, so a plain build is
# unchanged; an app that wants the bytes gone takes `egui-react-app` with
# `default-features = false`.
egui = { version = "0.36.1", default-features = false }
# The version egui 0.36.1 depends on: the `TreeUpdate` the adapter is handed
# comes straight out of egui, so the types have to be the same ones.
accesskit = "0.24.1"
# The newest consumer that works against accesskit 0.24.1 — the pair
# `accesskit_macos` uses.
accesskit_consumer = "0.38.0"
# eframe's default features minus `default_fonts` (see `egui` above), spelled
# out so nothing else changes. The one part of its default that cannot be
# written here is `winit/default`: a dependency's feature list may not name a
# feature of a *transitive* dependency, which is why `winit` is a workspace
# dependency of its own below.
eframe = { version = "0.36.1", default-features = false, features = [
  "accesskit",
  "links",
  "wayland",
  "web_screen_reader",
  "wgpu",
  "x11",
] }
# Only here to give winit the default features `eframe/default` used to enable
# for it: on Linux `wayland-dlopen` (load the Wayland libraries at run time
# instead of linking them) and `wayland-csd-adwaita` (client-side window
# decorations). `egui-react-app` depends on it without calling it; eframe does.
winit = "0.30.13"
# `wgpu` and `snapshot` are intentionally left off: the tests run headless.
egui_kittest = { version = "0.36.1", default-features = false }
# The same version and features egui_taffy 0.14.0 pulled in, so that layouts
# come out exactly as they did before the own engine replaced it.
taffy = { version = "0.9.2", default-features = false, features = [
  "taffy_tree",
  "detailed_layout_info",
  "block_layout",
  "content_size",
  "flexbox",
  "grid",
  "std",
] }
# The version eframe 0.36.1 depends on. Pinned here so an example that builds
# a render pipeline links against the same wgpu eframe does.
wgpu = "30.0"
# The same version eframe 0.36.1 pulls in, with the same (default) features, so
# `Callback::new_paint_callback` speaks to the renderer eframe set up.
egui-wgpu = "0.36.1"
# The version wgpu 30 uses, with the WGSL front end: the `patch` example runs
# the shader it generated through naga's parser and validator on the CPU,
# inside a `use_memo`, before any GPU sees it. `wgpu::naga` re-exports the same
# crate, but only when wgpu was built with a backend that needs it, which is
# not the case on every target the examples build for.
naga = { version = "30.0", features = ["wgsl-in"] }
# For `#[derive(Pod, Zeroable)]` on the shader example's uniform block.
bytemuck = { version = "1.25", features = ["derive"] }
# The one place font bytes live on every target (`egui_react_app::fonts`): the
# installed fonts on native, the bundled / fetched / granted bytes on wasm. Its
# matching is a port of font-kit's CSS Fonts Level 3 algorithm and it is pure
# Rust, so neither the wasm build nor CI needs anything extra. Default features
# off here so that the wasm target can leave `fs` / `memmap` / `fontconfig` out;
# the runner turns them on for native.
fontdb = { version = "0.24", default-features = false }
# The parser epaint 0.36.1 reads fonts with, at the version in Cargo.lock. The
# resolver runs `FontRef::from_index` on every face before handing it to egui,
# so bytes epaint would panic on end up in the report instead.
skrifa = "0.44"
# WOFF / WOFF2 decoding for `fonts::FontSource::Url`, behind the runner's
# `woff2` feature: the Brotli tables are not small, and a font served next to
# `index.html` is normally a TTF.
wuff = "0.2"
# The bytes egui ships (Hack, Ubuntu-Light, the two emoji fonts). Tests only:
# they stand in for "a font the app bundled" and "a font installed on the
# device" without reading anything from disk.
epaint_default_fonts = "0.36.1"
rstml = "0.13.0"
syn = { version = "3.0.5", features = ["full", "extra-traits", "visit", "visit-mut", "parsing", "printing", "proc-macro"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
typed-builder = "0.23.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.106"
wasm-bindgen-test = "0.3.56"
wasm-bindgen-futures = "0.4.56"
web-sys = "0.3.83"
# `navigator.fonts` has no web-sys binding, so the Local Font Access source
# reaches it with `Reflect::get` and `Function::call0`.
js-sys = "0.3.83"
trybuild = "1.0.120"
ehttp = "0.7.1"
elsa = "1.11.2"
log = "0.4.34"
env_logger = "0.11"
# `std::time::SystemTime::now()` panics on wasm32-unknown-unknown; this is the
# drop-in replacement that uses `performance.now()` there.
web-time = "1.1.0"
pollster = "1.0.1"
