[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fand/egui-react"
rust-version = "1.95"

[workspace.dependencies]
egui-react = { path = "crates/egui-react", version = "0.1.0" }
egui-react-macros = { path = "crates/egui-react-macros", version = "0.1.0" }
egui-react-elements = { path = "crates/egui-react-elements", version = "0.1.0" }
egui-react-app = { path = "crates/egui-react-app", version = "0.1.0" }
accesskit-web = { path = "crates/accesskit-web", version = "0.1.0" }
example-meta = { path = "examples/meta", version = "0.1.0" }

egui = "0.36.1"
# The version egui 0.36.1 depends on: the `TreeUpdate` the adapter is handed
# comes straight out of egui, so the types have to be the same ones.
accesskit = "0.24.1"
# The newest consumer that works against accesskit 0.24.1 — the pair
# `accesskit_macos` uses.
accesskit_consumer = "0.38.0"
eframe = "0.36.1"
# `wgpu` and `snapshot` are intentionally left off: the tests run headless.
egui_kittest = { version = "0.36.1", default-features = false }
egui_taffy = "0.14.0"
# The version eframe 0.36.1 depends on. Pinned here so an example that builds
# a render pipeline links against the same wgpu eframe does.
wgpu = "30.0"
# The same version eframe 0.36.1 pulls in, with the same (default) features, so
# `Callback::new_paint_callback` speaks to the renderer eframe set up.
egui-wgpu = "0.36.1"
# The version wgpu 30 uses, with the WGSL front end: the `patch` example runs
# the shader it generated through naga's parser and validator on the CPU,
# inside a `use_memo`, before any GPU sees it. `wgpu::naga` re-exports the same
# crate, but only when wgpu was built with a backend that needs it, which is
# not the case on every target the examples build for.
naga = { version = "30.0", features = ["wgsl-in"] }
# For `#[derive(Pod, Zeroable)]` on the shader example's uniform block.
bytemuck = { version = "1.25", features = ["derive"] }
# Only the gallery uses it, for `syntax_highlighting::code_view_ui`. No
# features: `syntect` would make the wasm much bigger and the built-in
# highlighter is enough.
egui_extras = { version = "0.36.1", default-features = false }
rstml = "0.13.0"
syn = { version = "3.0.5", features = ["full", "extra-traits", "visit", "visit-mut", "parsing", "printing", "proc-macro"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
typed-builder = "0.23.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.106"
wasm-bindgen-test = "0.3.56"
wasm-bindgen-futures = "0.4.56"
web-sys = "0.3.83"
trybuild = "1.0.120"
ehttp = "0.7.1"
elsa = "1.11.2"
log = "0.4.34"
# `std::time::SystemTime::now()` panics on wasm32-unknown-unknown; this is the
# drop-in replacement that uses `performance.now()` there.
web-time = "1.1.0"
pollster = "1.0.1"
