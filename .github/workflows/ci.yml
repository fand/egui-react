name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt / clippy / test / wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # eframe (pulled in by the examples, which `cargo test --workspace`
      # builds) needs the X11 / Wayland / GTK development headers on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-x11-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo check (wasm)
        run: cargo check --workspace --target wasm32-unknown-unknown

      - uses: jetli/trunk-action@v0.5.1
        with:
          version: latest

      # `trunk build <path>` resolves the cargo root package from the current
      # directory, so the example's Trunk.toml is passed instead.
      - name: trunk build (counter)
        run: trunk build --release --config examples/counter/Trunk.toml

      # Also the only check that the wasm `spawn_local` path of `use_future`
      # really links.
      - name: trunk build (fetch)
        run: trunk build --release --config examples/fetch/Trunk.toml

# The pixel snapshot tests (`cargo test -p react-egui-elements --features
# snapshot`) are deliberately not run here: the committed images are rendered on
# macOS and would not match this runner's software renderer. See the README.
