name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the run in flight: the old one is
# only ever going to report on a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts double the size of `target/`; CI never reuses them.
  CARGO_INCREMENTAL: 0
  # Debug info is most of the link time — and most of the bytes — of a test
  # binary with egui in it, and nothing here reads a backtrace. Set through the
  # environment rather than `[profile.dev]` so a local `cargo test` keeps it.
  CARGO_PROFILE_DEV_DEBUG: none
  CARGO_PROFILE_TEST_DEBUG: none

# The two halves share no build artifacts — clippy, the test binaries and the
# wasm builds each compile the workspace their own way — so running them as one
# job only added their times together.
jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    # Link the test binaries with mold (installed below). Scoped to the host
    # target rather than set in RUSTFLAGS, so a wasm build never inherits a
    # linker flag meant for the host, and scoped to this job so `wasm` keeps a
    # cache key of its own.
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      # `cargo test --workspace` links one debug binary per test file, several
      # hundred MB each with egui inside. The runner's ~14 GB was not enough
      # and `ld` died with a bus error, so drop the toolchains we never use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      # eframe (pulled in by the examples, which `cargo test --workspace`
      # builds) needs the X11 / Wayland / GTK development headers on Linux.
      # `mold` is the linker the job's RUSTFLAGS ask for; GCC 13 on this runner
      # resolves `-fuse-ld=mold` by name off PATH.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            mold \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-x11-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # A red run is the one most likely to be pushed to again in a minute.
          # Without this its dependency builds are thrown away.
          cache-on-failure: true

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
      # Without egui's embedded fonts (`egui-react-app` taken with
      # `default-features = false`): the resolver must not hand epaint a key
      # with no bytes behind it.
      - name: cargo test (no default fonts)
        run: cargo test -p egui-react-app --no-default-features

  wasm:
    name: wasm / trunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No X11 / Wayland / GTK headers here: nothing in the wasm dependency
      # graph reaches for them, and this job never builds for the host.

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo check (wasm)
        run: cargo check --workspace --target wasm32-unknown-unknown

      - uses: jetli/trunk-action@v0.5.1
        with:
          version: latest

      # `data-wasm-opt="z"` costs wasm-opt 25-40 s per example — three quarters
      # of this job — to shrink a `.wasm` that CI only ever checks the
      # existence of. `0` is the one level trunk answers by not running
      # wasm-opt at all. pages.yml and the Cloudflare PR preview still build
      # the gallery optimised, so the optimised path is covered on every PR.
      - name: Turn off wasm-opt for the build check
        run: sed -i 's/data-wasm-opt="[^"]*"/data-wasm-opt="0"/' examples/*/index.html

      # `trunk build <path>` resolves the cargo root package from the current
      # directory, so the example's Trunk.toml is passed instead.
      #
      # Every example, the gallery included. `fetch` is also the only check
      # that the wasm `spawn_local` path of `use_future` really links.
      - name: trunk build (every example)
        run: |
          for config in examples/*/Trunk.toml; do
            echo "==> $config"
            trunk build --release --config "$config"
          done

# The pixel snapshot tests (`cargo test -p egui-react-elements --features
# snapshot` and `cargo test -p gallery --features snapshot`) are deliberately
# not run here: the committed images are rendered on macOS and would not match
# this runner's software renderer. See the README.
