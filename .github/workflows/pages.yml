name: Pages

# Publishes the documentation site to https://fand.github.io/egui-reactor/:
# the VitePress pages, the `embed` wasm every example page runs in an iframe,
# and `cargo doc`. `site/build.sh` is what assembles the three; this workflow
# only installs the toolchains it needs and uploads what it produced.
#
# One manual step, once per repository: set Settings -> Pages -> Build and
# deployment -> Source to "GitHub Actions". Without it `deploy-pages` fails
# with "Pages site not found".

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# One deployment at a time. A newer push waits rather than cancelling, so the
# published site is always a commit that finished building.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same headers ci.yml installs. `cargo doc` builds for the host, so
      # unlike a wasm-only build this really does need them.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-x11-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # build.sh calls `trunk` and does not install it.
      - uses: jetli/trunk-action@v0.5.1
        with:
          version: latest

      # Node lives only in site/; the cache key is that directory's lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `SITE_BASE` is the subdirectory Pages serves from: VitePress uses it as
      # its `base` and trunk as the `--public-url` of the embed, so every
      # generated URL carries the prefix.
      - name: Build the site
        run: SITE_BASE=/egui-reactor/ bash site/build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
