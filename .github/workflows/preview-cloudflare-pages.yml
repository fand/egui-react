name: Deploy PR Preview to Cloudflare Pages

# Builds the documentation site — VitePress pages, the `embed` wasm and
# `cargo doc`, all through `site/build.sh` — for every pull request and
# publishes it as a branch deployment of the `egui-react` Cloudflare Pages
# project, then posts the preview URL as a sticky comment on the PR. The
# production site stays on GitHub Pages (see pages.yml); this is preview only.
#
# Setup, once per repository:
#   - Create a Cloudflare Pages project named `egui-react` (Direct Upload).
#   - Add the repository secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit)
#     and CLOUDFLARE_ACCOUNT_ID.

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always

# A newer push to the same PR supersedes the running build.
concurrency:
  group: cf-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: build site + deploy
    # Fork PRs don't get secrets, so skip the deploy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same headers ci.yml / pages.yml install. `cargo doc` builds for the
      # host, so unlike a wasm-only build this really does need them.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-x11-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # build.sh calls `trunk` and does not install it.
      - uses: jetli/trunk-action@v0.5.1
        with:
          version: latest

      # Node lives only in site/; the cache key is that directory's lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Unlike GitHub Pages, the preview is served from the domain root, so the
      # base is `/`.
      - name: Build the site
        run: SITE_BASE=/ bash site/build.sh

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/.vitepress/dist --project-name=egui-react --branch=${{ github.head_ref }}

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cf-preview
          message: |
            🚀 **Cloudflare Pages preview** — ${{ github.event.pull_request.head.sha }}
            ${{ steps.deploy.outputs.pages-deployment-alias-url }}
